# Pre-commit hooks for terraform-aws-codeartifact-quarantine.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run on all files:
#   pre-commit run --all-files
#
# Hook versions are pinned. Bump via `pre-commit autoupdate`.

repos:
  # ── Generic hygiene ──────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-yaml
      - id: check-json
        # state_machine.json.tftpl is a template; skip it (Terraform parses it).
        exclude: \.tftpl$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  # ── Terraform ────────────────────────────────────────────────────────────
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      # Canonical formatting. Fails if anything is unformatted.
      - id: terraform_fmt

      # Schema + reference validity. Runs `terraform init -backend=false` in each
      # module dir and `terraform validate`.
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true

      # tflint: lints for unused vars, deprecated syntax, aws provider-specific issues.
      # - id: terraform_tflint
      #   args:
      #     - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      #     - --args=--call-module-type=all

      # Trivy: security scanner. Catches issues like unencrypted resources, public S3, etc.
      # - id: terraform_trivy
      #   args:
      #     - --args=--severity HIGH,CRITICAL
      #     - --args=--skip-dirs="**/.terraform"
      #     - --args=--skip-dirs="**/examples"

      # Auto-generate input/output tables in module READMEs.
      # - id: terraform_docs
      #   args:
      #     - --hook-config=--path-to-file=README.md
      #     - --hook-config=--add-to-existing-file=true
      #     - --hook-config=--create-file-if-not-exist=false

  # ── Python (Lambda handlers) ─────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        files: ^lambda/
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        files: ^lambda/

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.409
    hooks:
      - id: pyright
        files: ^lambda/
        # Lambda handlers use boto3 stubs in dev only; not vendored at runtime.
        additional_dependencies:
          - "boto3-stubs[essential,codeartifact,inspector2,lambda,sns,sqs,stepfunctions,dynamodb]"

  # ── Spell-check long-form prose (READMEs, PLAN.md) ───────────────────────
  - repo: https://github.com/crate-ci/typos
    rev: v1.28.4
    hooks:
      - id: typos
        # Don't fail on typos in vendored output; only project-authored content.
        exclude: ^(\.terraform/|.*\.tfstate.*|lambda/.*/common/)
