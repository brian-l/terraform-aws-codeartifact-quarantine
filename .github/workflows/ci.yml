# CI for terraform-aws-codeartifact-quarantine.
#
# Runs on every PR + push to main. Every Action is SHA-pinned (not tag-pinned)
# to defend against tag-hijack attacks. The `# vX.Y.Z` comment is human-only;
# the SHA is authoritative.
#
# Workflow-injection safety: this workflow does not interpolate any user-
# controllable strings (PR titles, commit messages, issue bodies, head refs)
# into shell `run:` blocks. All `run:` content is static.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: "1.10.3"
          terraform_wrapper: false

      # Binaries required by the pre-commit-terraform hooks (tflint, trivy,
      # terraform-docs). The pre-commit hook itself only wraps the CLI; the
      # CLI must be on PATH. Versions are pinned to match local dev.
      - name: Set up tflint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93  # v6.2.2
        with:
          tflint_version: v0.62.0

      - name: Set up trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514  # v0.2.6
        with:
          version: v0.70.0

      - name: Install terraform-docs
        env:
          TFDOCS_VERSION: v0.20.0
          TFDOCS_SHA256: 34ae01772412bb11474e6718ea62113e38ff5964ee570a98c69fafe3a6dff286
        run: |
          set -euo pipefail
          archive="terraform-docs-${TFDOCS_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/terraform-docs/terraform-docs/releases/download/${TFDOCS_VERSION}/${archive}"
          echo "${TFDOCS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" terraform-docs
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/
          rm "$archive"
          terraform-docs --version

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  example-plan:
    name: example/simple terraform plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: "1.10.3"
          terraform_wrapper: false

      - name: terraform init
        working-directory: examples/simple
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: examples/simple
        run: terraform validate

  lambda-tests:
    name: Lambda unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # boto3 and boto3-stubs versions match those exercised by pre-commit's
        # pyright hook so test failures mirror production-time type errors.
        # Install into a uv-managed venv: the runner's system Python is
        # PEP 668-protected so `uv pip install --system` is rejected.
        run: |
          uv venv --python 3.12
          uv pip install \
            'boto3==1.43.6' \
            'boto3-stubs[essential,codeartifact,inspector2,lambda,sns,sqs,stepfunctions,dynamodb]==1.43.6' \
            'pytest==9.0.3' \
            'pytest-cov==7.1.0' \
            'pytest-mock==3.15.1'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run pytest
        run: pytest
